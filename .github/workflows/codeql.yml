name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run security scans every Monday at 06:00 UTC
    - cron: "0 6 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: rust
          queries: security-and-quality

      - name: Build Rust workspace
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        id: codeql-analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:rust"
        continue-on-error: true

      # The analyze action sometimes fails on the final status-report POST
      # (Connect Timeout to api.github.com:443) even though SARIF was uploaded.
      # Retry the upload manually if the first attempt failed.
      - name: Retry CodeQL SARIF upload
        if: steps.codeql-analyze.outcome == 'failure'
        run: |
          for attempt in 1 2 3; do
            echo "=== Retry $attempt: Uploading SARIF directly ==="
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github.v3+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -F "category=/language:rust" \
              -F "commit_sha=$GITHUB_SHA" \
              -F "ref=refs/heads/$GITHUB_REF_NAME" \
              -F "sarif@rust.sarif=@sarif-results/rust.sarif" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/code-scanning/sarifs")
            if [ "$STATUS" = "201" ]; then
              echo "SARIF upload succeeded on attempt $attempt"
              exit 0
            fi
            echo "Upload returned HTTP $STATUS, retrying in 90s..."
            sleep 90
          done
          echo "SARIF upload failed after 3 attempts"
          # Don't fail the job — the analyze step may have partially succeeded
          exit 0

  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  audit:
    name: Rust Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-audit-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-audit-

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --force

      - name: Run cargo audit
        run: cargo audit
        continue-on-error: true