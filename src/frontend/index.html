<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wiki Labs AI Copilot</title>
    <style>
      html, body, #root { height: 100%; margin: 0; }
      body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f0f23; color: #a1a1aa; }
      #root { height: 100vh; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!-- DEBUG: visible fallback that shows immediately -->
    <div id="loading-fallback" style="position:fixed;top:0;left:0;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;font-size:24px;color:#ff6b6b;z-index:9999;">
      Page Loaded — Checking...
    </div>
    <script>
      // Inline error handler — runs BEFORE the module script
      window.onerror = function(msg, url, line, col, err) {
        var root = document.getElementById('root');
        if (root) {
          root.innerHTML = '<div style="padding:20px;color:#ff6b6b;font-family:sans-serif;font-size:16px;"><b>JS Error:</b><br>' + msg + '<br>URL: ' + url + '<br>Line: ' + line + '</div>';
        }
        // Hide fallback
        var fb = document.getElementById('loading-fallback');
        if (fb) fb.style.display = 'none';
        return false;
      };
      window.addEventListener('unhandledrejection', function(e) {
        var root = document.getElementById('root');
        if (root) {
          root.innerHTML = '<div style="padding:20px;color:#ff6b6b;font-family:sans-serif;font-size:16px;"><b>Unhandled Rejection:</b><br>' + e.reason + '</div>';
        }
        var fb = document.getElementById('loading-fallback');
        if (fb) fb.style.display = 'none';
      });
      // Track DOM changes to hide loading fallback
      const fb = document.getElementById('loading-fallback');
      const observer = new MutationObserver(function() {
        // If root has children, React has rendered — hide fallback
        if (document.getElementById('root') && document.getElementById('root').children.length > 0) {
          if (fb) fb.style.display = 'none';
        }
      });
      if (document.getElementById('root')) {
        observer.observe(document.getElementById('root'), { childList: true, subtree: true });
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
